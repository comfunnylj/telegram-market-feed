name: Diagnose and repair Threads partial publication November 14
on:
  push:
    paths:
      - '.github/workflows/repair-threads-partial-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-social-publisher-maintenance
  cancel-in-progress: false
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORACLE_KEY: ${{ secrets.SOCIAL_PUBLISHER_SSH_KEY || secrets.ORACLE_SSH_KEY || secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_HOST_KEYS: ${{ secrets.SOCIAL_PUBLISHER_KNOWN_HOSTS || secrets.ORACLE_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only audit of live code private history and Meta posts
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/sp-ssh"
          trap 'rm -rf "$RUNNER_TEMP/sp-ssh"' EXIT
          python3 social-publisher/diagnostics/prepare-oracle-ssh.py
          SSH_ARGS=(-i "$RUNNER_TEMP/sp-ssh/key" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/sp-ssh/known_hosts")
          ssh "${SSH_ARGS[@]}" ubuntu@161.33.141.193 'umask 077; mkdir -p /home/ubuntu/sp-partial-20261114-audit'
          cat social-publisher/oracle-recovery/november/audit_remote.py | ssh "${SSH_ARGS[@]}" ubuntu@161.33.141.193 'umask 077; cat > /home/ubuntu/sp-partial-20261114-audit/audit_remote.py'
          ssh "${SSH_ARGS[@]}" ubuntu@161.33.141.193 'sudo -n python3 /home/ubuntu/sp-partial-20261114-audit/audit_remote.py' | tee oracle-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-partial-20261114-audit
          path: oracle-audit.txt
          retention-days: 14
