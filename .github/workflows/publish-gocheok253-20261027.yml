name: Publish Gocheok253 to Threads once with final blog link
on:
  push:
    paths:
      - '.github/workflows/publish-gocheok253-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gocheok253-224455463952-once
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Pillow for media normalization and verification
        run: python3 -m pip install --quiet --break-system-packages Pillow
      - name: Validate Oracle, prepare 3 charts, enqueue and verify all 4 Threads parts
        run: python3 social-publisher/diagnostics/publish-gocheok253-20261027.py
