name: Publish Jeonnong9 redevelopment Threads once with confirmed blog link
on:
  push:
    paths:
      - '.github/workflows/publish-jeonnong9-20261029.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jeonnong9-224457184172-threads-once
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Pillow and Korean typefaces for data cards
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify, publish connected posts to Oracle and save Meta receipts
        run: python3 social-publisher/diagnostics/publish-jeonnong9-20261029.py
