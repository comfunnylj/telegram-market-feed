name: Publish Seogye Redevelopment Threads with Naver blog link
on:
  push:
    paths:
      - '.github/workflows/publish-seogye-20261027.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seogye-224455764746-threads-once
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install Pillow and Korean text fonts for exact-data charts
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Preflight, publish five connected Threads parts and verify URLs
        run: python3 social-publisher/diagnostics/publish-seogye-20261027.py
