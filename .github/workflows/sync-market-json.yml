name: Sync market JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest dashboard JSON
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 "https://161-33-141-193.sslip.io/final_report.json" -o final_report.json
          curl -fsSL --retry 3 --retry-delay 5 "https://161-33-141-193.sslip.io/daily_report.json" -o daily_report.json
          curl -fsSL --retry 3 --retry-delay 5 "https://161-33-141-193.sslip.io/top_issues.json" -o top_issues.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final_report.json daily_report.json top_issues.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync latest market JSON"
            git push
          fi
