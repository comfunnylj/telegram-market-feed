name: Myeonmok9 authorized Threads recovery retry
on:
  push:
    paths:
      - '.github/workflows/recover-myeonmok9-20261023.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: myeonmok9-authorized-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install image tools
        run: python3 -m pip install --quiet --break-system-packages Pillow
      - name: Verify exact two photos and submit protected retry
        run: python3 social-publisher/diagnostics/recover-myeonmok9-20261023.py
